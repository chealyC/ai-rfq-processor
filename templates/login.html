<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AI RFQ Processor</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="login-container">

        <div class="login-box">

            <h1>AI RFQ Processor</h1>

            <p>Sign in to your account</p>

            {% if error %}
                <div class="login-error">
                    {{ error }}
                </div>
            {% endif %}

            <form action="/login" method="post">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </main>

</body>
</html>
